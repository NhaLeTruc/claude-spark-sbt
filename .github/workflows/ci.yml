name: CI

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'

    - name: Cache SBT
      uses: actions/cache@v3
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
          ~/.m2/repository
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
        restore-keys: |
          ${{ runner.os }}-sbt-

    - name: Compile
      run: sbt compile

    - name: Check code formatting
      run: sbt scalafmtCheck
      continue-on-error: true

    - name: Run scalastyle
      run: sbt scalastyle
      continue-on-error: true

    - name: Run tests
      run: sbt test

    - name: Generate coverage report
      run: sbt coverage test coverageReport
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./target/scala-2.12/scoverage-report/scoverage.xml
        fail_ci_if_error: false

    - name: Build assembly JAR
      run: sbt assembly

    - name: Upload assembly artifact
      uses: actions/upload-artifact@v3
      with:
        name: etl-pipeline-jar
        path: target/scala-2.12/claude-spark-etl-*.jar
        retention-days: 7

  docker-services:
    name: Integration Tests with Docker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'

    - name: Start Docker services
      run: docker-compose up -d

    - name: Wait for services
      run: |
        echo "Waiting for services to be ready..."
        sleep 30
        docker-compose ps

    - name: Run integration tests
      run: sbt "testOnly *IntegrationSpec"
      continue-on-error: true

    - name: Stop Docker services
      run: docker-compose down
      if: always()

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'

    - name: Check formatting
      run: sbt scalafmtCheck scalafmtSbtCheck

    - name: Run scalastyle
      run: sbt scalastyle

    - name: Check for warnings
      run: sbt compile 2>&1 | tee compile.log && ! grep -i "warning" compile.log
      continue-on-error: true
